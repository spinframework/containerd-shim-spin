name: Build, Test, and Publish node-installer image

on:
  workflow_call:
    inputs:
      ref:
        description: 'the git ref for the associated workflow'
        type: string
        required: true

jobs:
  build-and-test:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KUBERNETES_VERSION: ${{ vars.KUBERNETES_VERSION || '1.36' }}
      KIND_VERSION: v0.33.0
    strategy:
      fail-fast: false
      matrix:
        distribution: [kind, minikube, microk8s, k3s]
    outputs:
      release_version: ${{ steps.set_version.outputs.RELEASE_VERSION }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve Kubernetes version
        id: kubernetes
        run: |
          if [[ ! "$KUBERNETES_VERSION" =~ ^1\.[0-9]+$ ]]; then
            echo "::error::KUBERNETES_VERSION must be a minor version such as 1.36"
            exit 1
          fi
          version=$(curl --fail --silent --show-error --location \
            "https://dl.k8s.io/release/stable-${KUBERNETES_VERSION}.txt")
          if [[ ! "$version" =~ ^v${KUBERNETES_VERSION//./\\.}\.[0-9]+$ ]]; then
            echo "::error::Unexpected Kubernetes version: $version"
            exit 1
          fi
          echo "KUBERNETES_PATCH_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Testing Kubernetes $KUBERNETES_VERSION (upstream patch: $version)"

      - uses: azure/setup-kubectl@v4
        with:
          version: ${{ steps.kubernetes.outputs.version }}

      - name: Set RELEASE_VERSION env var
        id: set_version
        run: |
          if [[ "${{ startsWith(inputs.ref, 'refs/tags/v')}}" == "true" ]]; then
            RELEASE_VERSION=$(echo -n ${{ inputs.ref }} | cut -d '/' -f 3)
          else
            RELEASE_VERSION=$(date +%Y%m%d-%H%M%S)-g$(git rev-parse --short HEAD)
          fi
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v8
        with:
          path: _artifacts
          pattern: "!*.dockerbuild"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract musl artifacts into ./node-installer/.tmp/linux/(amd64|arm64) dir
        run: |
          mkdir -p ./node-installer/.tmp/linux/amd64
          mkdir -p ./node-installer/.tmp/linux/arm64
          for f in ./_artifacts/*/*-x86_64.tar.gz; do tar -xf $f --directory ./node-installer/.tmp/linux/amd64; done
          for f in ./_artifacts/*/*-aarch64.tar.gz; do tar -xf $f --directory ./node-installer/.tmp/linux/arm64; done

      - name: Build node-installer image for testing
        run: make build-dev-installer-image
        working-directory: node-installer

      - name: Resolve kind node image
        if: matrix.distribution == 'kind'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image=$(curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/kubernetes-sigs/kind/releases/tags/${KIND_VERSION}" |
            jq --exit-status --raw-output --arg prefix "kindest/node:v${KUBERNETES_VERSION}." '
              [.body | scan("kindest/node:v[0-9]+\\.[0-9]+\\.[0-9]+@sha256:[a-f0-9]{64}")
                | select(startswith($prefix))] | unique
              | if length == 1 then .[0]
                else error("Expected one kind node image for the selected Kubernetes minor")
                end')
          echo "KIND_NODE_IMAGE=$image" >> "$GITHUB_ENV"
          echo "Testing kind $KIND_VERSION with $image"

      - uses: helm/kind-action@v1.14.0
        if: matrix.distribution == 'kind'
        with:
          install_only: true
          version: ${{ env.KIND_VERSION }}
          kubectl_version: ${{ steps.kubernetes.outputs.version }}

      - uses: medyagh/setup-minikube@v0.0.21
        if: matrix.distribution == 'minikube'
        with:
          start: false
          minikube-version: latest
          container-runtime: containerd

      - if: matrix.distribution == 'microk8s'
        name: Install MicroK8s
        run: |
          cat /etc/os-release
          sudo --version
          snap version
          sudo snap install microk8s --classic --channel="${KUBERNETES_VERSION}/stable"
          snap list microk8s
          sudo microk8s status --wait-ready --timeout=180

      - name: Run ${{ matrix.distribution }} integration test
        run: make test-${{ matrix.distribution }}
        working-directory: node-installer

      - name: Collect MicroK8s debug logs
        if: matrix.distribution == 'microk8s' && failure()
        run: |
          sudo snap services microk8s
          sudo journalctl -u snapd.service --no-pager -n 100
          sudo microk8s inspect
      
      - name: Collect k3s debug logs
        if: matrix.distribution == 'k3s' && failure()
        run: |
          sudo k3s kubectl describe pods -n kwasm
          sudo k3s kubectl logs k3s-provision-kwasm-dev -n kwasm
          sudo k3s kubectl describe pods
      
      - name: Collect minikube debug logs
        if: matrix.distribution == 'minikube' && failure()
        run: |
          kubectl describe pods -n kwasm
          kubectl logs minikube-provision-kwasm-dev -n kwasm 
          kubectl describe pods

  publish:
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: _artifacts
          pattern: "!*.dockerbuild"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract musl artifacts into ./node-installer/.tmp/linux/(amd64|arm64) dir
        run: |
          mkdir -p ./node-installer/.tmp/linux/amd64
          mkdir -p ./node-installer/.tmp/linux/arm64
          for f in ./_artifacts/*/*-x86_64.tar.gz; do tar -xf $f --directory ./node-installer/.tmp/linux/amd64; done
          for f in ./_artifacts/*/*-aarch64.tar.gz; do tar -xf $f --directory ./node-installer/.tmp/linux/arm64; done

      - name: Login to GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push node-installer image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/node-installer:${{ needs.build-and-test.outputs.release_version }}
          context: node-installer
          platforms: linux/amd64,linux/arm64

      - name: Clear
        if: always()
        run: |
          rm -f ${HOME}/.docker/config.json
