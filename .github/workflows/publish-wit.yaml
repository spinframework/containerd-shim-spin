name: Publish WIT to registry

on:
  workflow_dispatch:

jobs:
  publish-wit:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.23.0
        with:
          version: "1.20.0"

      - name: Install wasm-tools
        shell: bash
        run: cargo binstall --version 1.249.0 wasm-tools

      - name: Install wkg
        shell: bash
        run: cargo binstall --version 0.16.1 wkg

      - name: Login to the GitHub registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish WIT package
        shell: bash
        run: ./scripts/build-and-publish-wit.sh