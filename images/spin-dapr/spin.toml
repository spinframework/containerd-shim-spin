spin_manifest_version = 2

[application]
authors = ["Sven Pfennig <s.pfennig@reply.de>"]
description = "Example application to use Dapr with Spin"
name = "spin-dapr"
version = "0.1.0"

[[trigger.http]]
route = "/..."
component = "spin-dapr"

[component.spin-dapr]
source = "target/wasm32-wasip2/release/spin_dapr.wasm"
allowed_outbound_hosts = ["redis://localhost:6379"]

[component.spin-dapr.build]
command = "cargo build --target wasm32-wasip2 --release"
watch = ["src/**/*.rs", "Cargo.toml"]
